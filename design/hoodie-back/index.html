<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVRF Hoodie Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  :root { --ink:#0B0D0E; --paper:#EFEEE7; --orange:#FF4E1F; --mist:#CFDBDA; --marl:#a9aaa7; }
  * { box-sizing: border-box; }
  body { margin:0; background:#16191a; color:var(--paper); font:13px/1.4 "JetBrains Mono", monospace; }
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:16px; }
  label { display:flex; gap:6px; align-items:center; color:var(--mist); }
  select, button { font:inherit; padding:8px 10px; border:0; }
  select { background:#262b2d; color:var(--paper); max-width:280px; }
  button { background:var(--orange); color:var(--ink); font-weight:700; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:wait; }
  #status { color:var(--mist); flex-basis:100%; }
  main { padding:0 16px 32px; display:flex; justify-content:center; }
  .garment { background:var(--marl); padding:min(8vw,64px); width:100%; max-width:820px; }
  canvas { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<header>
  <label>Layout <select id="preset"></select></label>
  <label>Line <select id="slogan"></select></label>
  <label>Dot size <select id="cell">
    <option value="16">Fine (19 lpi)</option><option value="20" selected>Medium (15 lpi)</option><option value="26">Coarse (11.5 lpi)</option>
  </select></label>
  <button id="dl" disabled>Download print PNG</button>
  <span id="status">Loading photos…</span>
</header>
<main><div class="garment"><canvas id="c" width="3600" height="4800"></canvas></div></main>

<script>
// ---------------------------------------------------------------------------
// SVRF hoodie back, set up for DTG on grey marl with no white underbase.
//
// Everything photographic is a single-colour ink halftone on a transparent
// background, so the grey marl is every highlight and the ink soaks in.
// Dots are capped so even the blacks never close up into solid ink.
// Type is knocked out of the dots (garment shows through) or printed as ink.
// Orange is the only second colour: grease pencil and the wordmark offset.
//
// Serve this folder over http (python3 -m http.server) so the canvas exports.
// ---------------------------------------------------------------------------

// A shot = [image path, focal x, focal y, zoom]. Zoom > 1 crops tighter.
const PRESETS = {
  carpark: {
    label: "Carpark (lead) + set-wave strip",
    hero: ["photos/carpark.jpg", 0.5, 0.5, 1],
    tone: { k: 1.45, gamma: 0.7 },
    burnBottom: 0.3,
    strip: { x: 210, y: 470, rot: -0.026, frames: [
      ["photos/set-wave.jpg", 0.5, 0.45, 1],
      ["photos/set-wave.jpg", 0.74, 0.72, 2.4],
      ["photos/set-wave.jpg", 0.82, 0.25, 2.0],
    ] },
    stripCaption: [240, 2090],
    wordmark: false,
    line: { x: 3600 - 170, y: 4800 - 250, align: "right" },
  },
  wave: {
    label: "Set wave (lead) + carpark strip",
    hero: ["photos/set-wave.jpg", 0.78, 0.5, 1],
    tone: { k: 2.2, gamma: 1.1 },
    burnBottom: 0.75,
    strip: { x: 2540, y: 520, rot: 0.028, frames: [
      ["photos/carpark.jpg", 0.8, 0.3, 2.2],
      ["photos/carpark.jpg", 0.61, 0.48, 2.6],
      ["photos/carpark.jpg", 0.55, 0.86, 2.0],
    ] },
    stripCaption: [2560, 2370],
    wordmark: true,
    line: { x: 160, y: 4800 - 2020, align: "left" },
  },
};
const LINES = [
  "IT WAS BETTER YESTERDAY.",
  "COLD HANDS. NO WITNESSES.",
  "NOBODY OUT. KEEP IT THAT WAY.",
  "LOCATION WITHHELD.",
];

const W = 3600, H = 4800, M = 170;
const INK = "#0B0D0E", ORANGE = "#FF4E1F";
const MAX_DOT = 0.56;   // dot radius as a share of the cell; < 0.71 keeps gaps between dots in the blacks
const MIN_DOT = 1.6;   // px; smaller dots are dropped so highlights stay clean garment

let seed;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const rr = (a, b) => a + (b - a) * rnd();

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
const cache = new Map();

function loadImg(src) {
  if (!cache.has(src)) cache.set(src, new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  }));
  return cache.get(src);
}

const clamp = (v) => Math.min(1, Math.max(0, v));
const canvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

function cropTo(img, w, h, fx = 0.5, fy = 0.5, zoom = 1) {
  const c = canvas(w, h), g = c.getContext("2d");
  if (!img) { g.fillStyle = "#777"; g.fillRect(0, 0, w, h); return c; }
  const s = Math.max(w / img.width, h / img.height) * zoom, sw = w / s, sh = h / s;
  const sx = Math.min(Math.max(img.width * fx - sw / 2, 0), img.width - sw);
  const sy = Math.min(Math.max(img.height * fy - sh / 2, 0), img.height - sh);
  g.imageSmoothingQuality = "high";
  g.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return c;
}

// Greyscale with a contrast curve. Output is a tone map: white = no ink.
function tone(src, { k = 1.6, gamma = 1 } = {}) {
  const w = src.width, h = src.height, out = canvas(w, h), g = out.getContext("2d");
  g.drawImage(src, 0, 0);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    let v = Math.pow((0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255, gamma);
    v = clamp((v - 0.5) * k + 0.5) * 255;
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  g.putImageData(im, 0, 0);
  return out;
}

// Tone map → round ink dots on transparent, 45° screen.
function halftoneInk(toneCanvas, cell) {
  const w = toneCanvas.width, h = toneCanvas.height, out = canvas(w, h), g = out.getContext("2d");
  const d = toneCanvas.getContext("2d").getImageData(0, 0, w, h).data;
  const L = (x, y) => d[((Math.min(h - 1, Math.max(0, y | 0))) * w + Math.min(w - 1, Math.max(0, x | 0))) * 4] / 255;
  g.fillStyle = INK;
  const a = Math.PI / 4, ca = Math.cos(a), sa = Math.sin(a), R = Math.hypot(w, h) / 2 + cell;
  for (let u = -R; u < R; u += cell) for (let v = -R; v < R; v += cell) {
    const x = w / 2 + u * ca - v * sa, y = h / 2 + u * sa + v * ca;
    if (x < -cell || y < -cell || x > w + cell || y > h + cell) continue;
    const r = Math.sqrt(1 - L(x, y)) * cell * MAX_DOT;
    if (r < MIN_DOT) continue;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  return out;
}

function roughRect(g, x, y, w, h, amp = 10, step = 14) {
  const pts = [], side = (x0, y0, x1, y1, nx, ny) => {
    const n = Math.round(Math.hypot(x1 - x0, y1 - y0) / step);
    for (let i = 0; i < n; i++) { const t = i / n, j = rr(-amp, amp) * (rnd() < 0.08 ? 2.4 : 1); pts.push([x0 + (x1 - x0) * t + nx * j, y0 + (y1 - y0) * t + ny * j]); }
  };
  side(x, y, x + w, y, 0, 1); side(x + w, y, x + w, y + h, 1, 0); side(x + w, y + h, x, y + h, 0, 1); side(x, y + h, x, y, 1, 0);
  g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py))); g.closePath();
}

// Ink type on a cleared patch of garment, so small type never fights the dots.
function inkText(str, x, y, font, { align = "left", spacing = 0, rot = 0, pad = 22, color = INK } = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.letterSpacing = spacing + "px";
  const m = ctx.measureText(str), x0 = align === "right" ? -m.width : align === "center" ? -m.width / 2 : 0;
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillRect(x0 - pad, -m.actualBoundingBoxAscent - pad, m.width + pad * 2, m.actualBoundingBoxAscent + m.actualBoundingBoxDescent + pad * 2);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}

function regMark(x, y, r) {
  ctx.save(); ctx.strokeStyle = ORANGE; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - r * 1.6, y); ctx.lineTo(x + r * 1.6, y); ctx.moveTo(x, y - r * 1.6); ctx.lineTo(x, y + r * 1.6); ctx.stroke();
  ctx.restore();
}

// Contact strip geometry, shared by the tone pass and the marks pass.
const FW = 620, FH = 430, GAP = 46, EDGE = 92, SW = FW + EDGE * 2;
const stripH = (n) => n * (FH + GAP) + GAP + 60;

// Tone pass: film base, sprocket holes and frames go into the halftone.
function stripTone(g, frames, S) {
  g.save(); g.translate(S.x, S.y); g.rotate(S.rot);
  const sh = stripH(frames.length);
  g.fillStyle = "rgb(70,70,70)"; g.fillRect(0, 0, SW, sh);
  g.fillStyle = "#fff";
  for (let sy = 26; sy < sh - 30; sy += 66) { g.fillRect(26, sy, 40, 30); g.fillRect(SW - 66, sy, 40, 30); }
  frames.forEach((f, i) => g.drawImage(tone(cropTo(f.img, FW, FH, f.fx, f.fy, f.zoom), { k: 1.5 }), EDGE, GAP + i * (FH + GAP)));
  g.restore();
}

// Marks pass: frame-edge gaps, edge numbers and grease pencil, drawn over the dots.
function stripMarks(n, S) {
  ctx.save(); ctx.translate(S.x, S.y); ctx.rotate(S.rot);
  // Clean garment gaps between frames so each frame reads as a frame.
  ctx.globalCompositeOperation = "destination-out";
  for (let i = 0; i < n; i++) { ctx.lineWidth = 10; ctx.strokeRect(EDGE - 8, GAP + i * (FH + GAP) - 8, FW + 16, FH + 16); }
  ctx.globalCompositeOperation = "source-over";
  for (let i = 0; i < n; i++) {
    const fy = GAP + i * (FH + GAP);
    ctx.save(); ctx.translate(SW - 22, fy + FH / 2); ctx.rotate(Math.PI / 2);
    ctx.font = "700 32px 'JetBrains Mono'"; ctx.textAlign = "center"; ctx.letterSpacing = "4px";
    ctx.globalCompositeOperation = "destination-out"; ctx.lineWidth = 10; ctx.strokeText(`${14 + i}   ▸${14 + i}A`, 0, 0);
    ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = ORANGE; ctx.fillText(`${14 + i}   ▸${14 + i}A`, 0, 0);
    ctx.restore();
  }
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 18; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const ky = GAP + (FH + GAP) + FH / 2;
  ctx.beginPath();
  for (let a = 0.2; a < Math.PI * 2 + 0.75; a += 0.08) {
    const wob = 1 + Math.sin(a * 3) * 0.03;
    ctx.lineTo(SW / 2 + Math.cos(a) * (FW / 2 + 50) * wob, ky + Math.sin(a) * (FH / 2 + 44) * wob + a * 6);
  }
  ctx.stroke();
  const xy = GAP + FH / 2;
  ctx.beginPath(); ctx.moveTo(EDGE + 70, xy - 140); ctx.lineTo(EDGE + FW - 90, xy + 130);
  ctx.moveTo(EDGE + FW - 70, xy - 150); ctx.lineTo(EDGE + 100, xy + 140); ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------------------
async function render() {
  seed = 4471;
  $("dl").disabled = true; $("status").textContent = "Rendering…";
  await Promise.all([document.fonts.load("100px 'Archivo Black'"), document.fonts.load("700 100px 'JetBrains Mono'"), document.fonts.load("400 100px 'JetBrains Mono'")]);

  const P = PRESETS[$("preset").value], cell = +$("cell").value;
  const shots = [P.hero, ...P.strip.frames];
  const imgs = await Promise.all(shots.map((s) => loadImg(s[0])));
  const missing = [...new Set(shots.filter((_, i) => !imgs[i]).map((s) => s[0]))];
  const frames = P.strip.frames.map((f, i) => ({ img: imgs[i + 1], fx: f[1], fy: f[2], zoom: f[3] }));

  // 1. Tone map of everything photographic.
  const T = canvas(W, H), tg = T.getContext("2d");
  tg.drawImage(tone(cropTo(imgs[0], W, H, P.hero[1], P.hero[2], P.hero[3]), P.tone), 0, 0);
  let gr = tg.createLinearGradient(0, H * 0.6, 0, H);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, `rgba(0,0,0,${P.burnBottom})`);
  tg.fillStyle = gr; tg.fillRect(0, 0, W, H);
  gr = tg.createLinearGradient(0, 0, 0, 700);
  gr.addColorStop(0, "rgba(0,0,0,0.25)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  tg.fillStyle = gr; tg.fillRect(0, 0, W, 700);
  stripTone(tg, frames, P.strip);

  // 2. Halftone it into ink dots, inside a rough-cut edge.
  ctx.clearRect(0, 0, W, H);
  ctx.save(); roughRect(ctx, 30, 30, W - 60, H - 60, 9); ctx.clip();
  ctx.drawImage(halftoneInk(T, cell), 0, 0);
  ctx.restore();

  // 3. Type and marks.
  inkText("SVRF / COLD WATER DEPT.", M, M + 20, "700 50px 'JetBrains Mono'", { spacing: 6 });
  inkText("Nº 01 — LOCATION WITHHELD", W - M, M + 20, "400 50px 'JetBrains Mono'", { align: "right", spacing: 6 });
  regMark(W - M - 30, M + 135, 26);
  stripMarks(frames.length, P.strip);
  inkText("ROLL 07 · FR. 14–16 · PUSHED 2", P.stripCaption[0], P.stripCaption[1], "700 46px 'JetBrains Mono'", { spacing: 4, rot: P.strip.rot });

  // Label-maker tape: solid ink strip, letters knocked out to garment.
  const line = LINES[+$("slogan").value], lf = "700 92px 'JetBrains Mono'";
  ctx.font = lf; ctx.letterSpacing = "10px";
  const lw = ctx.measureText(line).width;
  const lx = P.line.align === "right" ? P.line.x - lw - 60 : P.line.x;
  ctx.save(); ctx.translate(lx - 10, P.line.y); ctx.rotate(-0.012);
  ctx.fillStyle = INK; ctx.fillRect(0, -100, lw + 80, 140);
  ctx.globalCompositeOperation = "destination-out";
  ctx.font = lf; ctx.letterSpacing = "10px"; ctx.fillText(line, 40, 0);
  ctx.restore();

  // Wordmark: knocked out of the dots, with a misregistered orange offset.
  if (P.wordmark) {
    ctx.font = "1000px 'Archivo Black'"; ctx.letterSpacing = "-10px";
    const sx = (W - 2 * 110) / ctx.measureText("SVRF").width;
    const mark = (dx, dy) => {
      ctx.save(); ctx.translate(W / 2 + dx, H + 150 + dy); ctx.scale(sx, sx * 0.94);
      ctx.font = "1000px 'Archivo Black'"; ctx.letterSpacing = "-10px"; ctx.textAlign = "center";
      ctx.fillText("SVRF", 0, 0); ctx.restore();
    };
    ctx.save(); roughRect(ctx, 30, 30, W - 60, H - 60, 9); ctx.clip();
    ctx.fillStyle = ORANGE; mark(26, -18);
    ctx.globalCompositeOperation = "destination-out"; mark(0, 0);
    ctx.restore();
  }
  ctx.letterSpacing = "0px";

  $("status").textContent = (missing.length ? `Couldn't load: ${missing.join(", ")}. ` : "") +
    "Rendered. Ink + orange only, transparent everywhere else: print with no white underbase.";
  $("dl").disabled = false;
}

$("dl").onclick = () => {
  try {
    cv.toBlob((b) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = `svrf-hoodie-back-${$("preset").value}-greymarl.png`; a.click();
    }, "image/png");
  } catch (e) {
    $("status").textContent = "The browser blocked the export. Serve this folder over http:// (python3 -m http.server) and try again.";
  }
};

Object.entries(PRESETS).forEach(([k, p]) => $("preset").add(new Option(p.label, k)));
LINES.forEach((l, i) => $("slogan").add(new Option(l, i)));
["preset", "slogan", "cell"].forEach((id) => ($(id).onchange = render));
render();
</script>
</body>
</html>

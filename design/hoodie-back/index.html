<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVRF Hoodie Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  :root { --ink:#0B0D0E; --paper:#EFEEE7; --orange:#FF4E1F; --mist:#CFDBDA; --garment:#1b2233; }
  * { box-sizing: border-box; }
  body { margin:0; background:#16191a; color:var(--paper); font:13px/1.4 "JetBrains Mono", monospace; }
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:16px; }
  label { display:flex; gap:6px; align-items:center; color:var(--mist); }
  select, button { font:inherit; padding:8px 10px; border:0; }
  select { background:#262b2d; color:var(--paper); max-width:260px; }
  button { background:var(--orange); color:var(--ink); font-weight:700; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:wait; }
  #status { color:var(--mist); flex-basis:100%; }
  main { padding:0 16px 32px; display:flex; justify-content:center; }
  .garment { background:var(--garment); padding:min(8vw,64px); width:100%; max-width:820px; transition:background .2s; }
  canvas { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<header>
  <label>Lead photo <select id="hero"></select></label>
  <label>Treatment <select id="treat"><option value="xerox">Photocopy</option><option value="halftone">Halftone</option></select></label>
  <label>Line <select id="slogan"></select></label>
  <label>Hoodie <select id="garment">
    <option value="#1b2233">Navy</option><option value="#0e0f10">Black</option>
    <option value="#5a4636">Coffee</option><option value="#8d9092">Grey marl</option><option value="#e9e6dc">Ecru</option>
  </select></label>
  <button id="dl" disabled>Download print PNG</button>
  <span id="status">Loading Shopify images…</span>
</header>
<main><div class="garment" id="g"><canvas id="c" width="3600" height="4800"></canvas></div></main>

<script>
// ---------------------------------------------------------------------------
// SVRF hoodie back. Photo-led: one full-bleed lead shot, run through a
// photocopier, a contact-sheet strip, and a misregistered wordmark cut off
// the bottom edge. Outside the print is transparent, so the hoodie shows.
// All photos come from the SVRF Shopify Files library.
// ---------------------------------------------------------------------------
const CDN = "https://cdn.shopify.com/s/files/1/1039/7977/8385/files/";
// [label, file, focal x, focal y]
const PHOTOS = [
  ["Penhale Sands",        "inspiredimages-penhale-sands-1599463_1920.jpg", 0.5, 0.5],
  ["Beach",                "kranich17-beach-6282284.jpg",                   0.5, 0.5],
  ["Gulls",                "diego_torres-gulls-1937919.jpg",                0.5, 0.5],
  ["Upload 1",             "image-v1565998708745728000.jpg",                0.5, 0.5],
  ["Upload 2",             "image-v1565998704060690432.jpg",                0.5, 0.5],
  ["Upload 3",             "image-v1565998539740446720.jpg",                0.5, 0.5],
  ["Upload 4",             "image-v1565998532190699520.jpg",                0.5, 0.5],
  ["Forecast Tee, beanie", "723f7463dd4f4127a69078b53c5eefa6.jpg",          0.5, 0.35],
  ["Forecast Tee, cap",    "9186a21e6d2f4f00be45ef9a66e72de5.jpg",          0.5, 0.35],
  ["Fin Baby Tee",         "baby_Fin_Tee.jpg",                              0.5, 0.35],
  ["Carpark Robe sample",  "carpark-robe-factory-flatlay.jpg",              0.5, 0.5],
];
// Contact-strip frames, in order of preference (the lead photo is skipped).
const STRIP = ["Gulls", "Upload 1", "Beach", "Upload 2"];
const LINES = [
  "IT WAS BETTER YESTERDAY.",
  "COLD HANDS. NO WITNESSES.",
  "NOBODY OUT. KEEP IT THAT WAY.",
  "LOCATION WITHHELD.",
];

const W = 3600, H = 4800, M = 170;
const INK = "#0B0D0E", PAPER = "#EFEEE7", ORANGE = "#FF4E1F";

let seed;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const rr = (a, b) => a + (b - a) * rnd();

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
const cache = new Map();

function loadImg(file) {
  if (!cache.has(file)) cache.set(file, new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = CDN + file + "?width=2400";
  }));
  return cache.get(file);
}

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const clamp = (v) => Math.min(1, Math.max(0, v));
const canvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

function cropTo(img, w, h, fx = 0.5, fy = 0.5) {
  const c = canvas(w, h), g = c.getContext("2d");
  if (!img) { g.fillStyle = "#3a4042"; g.fillRect(0, 0, w, h); return c; }
  const s = Math.max(w / img.width, h / img.height), sw = w / s, sh = h / s;
  const sx = Math.min(Math.max(img.width * fx - sw / 2, 0), img.width - sw);
  const sy = Math.min(Math.max(img.height * fy - sh / 2, 0), img.height - sh);
  g.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return c;
}

// Photocopy: crushed blacks, blown highlights, toner noise, ink→paper ramp.
function xerox(src, { k = 2.1, gamma = 1.25, noise = 0.16, dark = INK, light = PAPER } = {}) {
  const w = src.width, h = src.height, out = canvas(w, h), g = out.getContext("2d");
  g.drawImage(src, 0, 0);
  const im = g.getImageData(0, 0, w, h), d = im.data, a = hex(dark), b = hex(light);
  for (let i = 0; i < d.length; i += 4) {
    let v = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
    v = Math.pow(v, gamma);
    v = clamp((v - 0.5) * k + 0.5 + (rnd() - 0.5) * noise);
    d[i] = a[0] + (b[0] - a[0]) * v; d[i + 1] = a[1] + (b[1] - a[1]) * v; d[i + 2] = a[2] + (b[2] - a[2]) * v;
  }
  g.putImageData(im, 0, 0);
  return out;
}

function halftone(src, cell = 30, angle = 0.785, k = 1.9) {
  const w = src.width, h = src.height, out = canvas(w, h), g = out.getContext("2d");
  const d = src.getContext("2d").getImageData(0, 0, w, h).data;
  const L = (x, y) => { const i = (Math.min(h - 1, Math.max(0, y | 0)) * w + Math.min(w - 1, Math.max(0, x | 0))) * 4; return (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255; };
  g.fillStyle = PAPER; g.fillRect(0, 0, w, h); g.fillStyle = INK;
  const ca = Math.cos(angle), sa = Math.sin(angle), R = Math.hypot(w, h);
  for (let u = -R; u < R; u += cell) for (let v = -R; v < R; v += cell) {
    const x = w / 2 + u * ca - v * sa, y = h / 2 + u * sa + v * ca;
    if (x < -cell || y < -cell || x > w + cell || y > h + cell) continue;
    const r = Math.sqrt(1 - clamp((L(x, y) - 0.5) * k + 0.5)) * cell * 0.74;
    if (r > 1) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  }
  return out;
}

// Rough, photocopied page edge.
function roughRect(g, x, y, w, h, amp = 10, step = 14) {
  const pts = [], side = (x0, y0, x1, y1, nx, ny) => {
    const n = Math.round(Math.hypot(x1 - x0, y1 - y0) / step);
    for (let i = 0; i < n; i++) { const t = i / n, j = rr(-amp, amp) * (rnd() < 0.08 ? 2.4 : 1); pts.push([x0 + (x1 - x0) * t + nx * j, y0 + (y1 - y0) * t + ny * j]); }
  };
  side(x, y, x + w, y, 0, 1); side(x + w, y, x + w, y + h, 1, 0); side(x + w, y + h, x, y + h, 0, 1); side(x, y + h, x, y, 1, 0);
  g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py))); g.closePath();
}

function text(str, x, y, font, color, { align = "left", spacing = 0, rot = 0 } = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.letterSpacing = spacing + "px"; ctx.fillText(str, 0, 0);
  ctx.restore();
}

// Toner grain + dust, clipped to the print.
function grainAndDust() {
  const t = canvas(300, 300), g = t.getContext("2d"), im = g.createImageData(300, 300);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
  ctx.save(); ctx.globalAlpha = 0.1; ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = ctx.createPattern(t, "repeat"); ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save();
  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = rnd() < 0.7 ? "rgba(239,238,231,0.75)" : "rgba(11,13,14,0.8)";
    ctx.beginPath(); ctx.ellipse(rr(0, W), rr(0, H), rr(2, 9), rr(2, 6), rr(0, 3), 0, Math.PI * 2); ctx.fill();
  }
  // A couple of hairs / scratches from the scanner glass
  ctx.strokeStyle = "rgba(239,238,231,0.55)"; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    let x = rr(200, W - 200), y = rr(200, H - 200); ctx.beginPath(); ctx.moveTo(x, y);
    for (let j = 0; j < 6; j++) { x += rr(-60, 60); y += rr(20, 70); ctx.lineTo(x, y); } ctx.stroke();
  }
  // One copier streak
  ctx.fillStyle = "rgba(239,238,231,0.07)"; ctx.fillRect(rr(600, 2400), 0, 26, H);
  ctx.restore();
}

function regMark(x, y, r, color) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - r * 1.6, y); ctx.lineTo(x + r * 1.6, y); ctx.moveTo(x, y - r * 1.6); ctx.lineTo(x, y + r * 1.6); ctx.stroke();
  ctx.restore();
}

// Vertical strip of 35mm frames with sprockets, edge numbers and grease pencil.
function contactStrip(frames, x, y, rot) {
  const fw = 620, fh = 430, gap = 46, edge = 92, sw = fw + edge * 2, sh = frames.length * (fh + gap) + gap + 60;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 50; ctx.shadowOffsetX = 14; ctx.shadowOffsetY = 20;
  ctx.fillStyle = "#121314"; ctx.fillRect(0, 0, sw, sh);
  ctx.shadowColor = "transparent";
  ctx.fillStyle = "#2b2d2e";
  for (let sy = 26; sy < sh - 30; sy += 66) { ctx.fillRect(26, sy, 40, 30); ctx.fillRect(sw - 66, sy, 40, 30); }
  frames.forEach((f, i) => {
    const fy = gap + i * (fh + gap);
    ctx.drawImage(xerox(cropTo(f.img, fw, fh, f.fx, f.fy), { k: 1.7, noise: 0.1, gamma: 1.1 }), edge, fy);
    ctx.save(); ctx.translate(sw - 20, fy + fh / 2); ctx.rotate(Math.PI / 2);
    ctx.font = "700 30px 'JetBrains Mono'"; ctx.fillStyle = "#c98a3a"; ctx.textAlign = "center"; ctx.letterSpacing = "4px";
    ctx.fillText(`${14 + i}   ▸${14 + i}A`, 0, 0); ctx.restore();
  });
  // Grease pencil: loop the keeper, cross out a reject.
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 16; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const ky = gap + 1 * (fh + gap) + fh / 2;
  ctx.beginPath();
  for (let a = 0.2; a < Math.PI * 2 + 0.75; a += 0.08) {
    const wob = 1 + Math.sin(a * 3) * 0.03;
    ctx.lineTo(sw / 2 + Math.cos(a) * (fw / 2 + 50) * wob, ky + Math.sin(a) * (fh / 2 + 44) * wob + a * 6);
  }
  ctx.stroke();
  const xy = gap + fh / 2;
  ctx.beginPath(); ctx.moveTo(edge + 70, xy - 140); ctx.lineTo(edge + fw - 90, xy + 130);
  ctx.moveTo(edge + fw - 70, xy - 150); ctx.lineTo(edge + 100, xy + 140); ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------------------
async function render() {
  seed = 4471;
  $("dl").disabled = true; $("status").textContent = "Rendering…";
  await Promise.all([document.fonts.load("100px 'Archivo Black'"), document.fonts.load("700 100px 'JetBrains Mono'"), document.fonts.load("400 100px 'JetBrains Mono'")]);

  const hero = PHOTOS[+$("hero").value];
  const stripPhotos = STRIP.map((n) => PHOTOS.find((p) => p[0] === n)).filter((p) => p && p !== hero).slice(0, 3);
  const all = [hero, ...stripPhotos];
  const imgs = await Promise.all(all.map((p) => loadImg(p[1])));
  const [heroImg, ...stripImgs] = imgs;
  const missing = all.filter((_, i) => !imgs[i]).map((p) => p[0]);

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  roughRect(ctx, 30, 30, W - 60, H - 60, 9);
  ctx.clip();

  // Lead photo, full bleed.
  const crop = cropTo(heroImg, W, H, hero[2], hero[3]);
  ctx.drawImage($("treat").value === "halftone" ? halftone(crop) : xerox(crop), 0, 0);

  // Burn the top and bottom like an uneven copy, so type sits on dark.
  let gr = ctx.createLinearGradient(0, H * 0.55, 0, H);
  gr.addColorStop(0, "rgba(11,13,14,0)"); gr.addColorStop(1, "rgba(11,13,14,0.92)");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  gr = ctx.createLinearGradient(0, 0, 0, 700);
  gr.addColorStop(0, "rgba(11,13,14,0.7)"); gr.addColorStop(1, "rgba(11,13,14,0)");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 700);

  // Header — small and quiet, like a slide mount.
  const m46 = "400 46px 'JetBrains Mono'";
  text("SVRF / COLD WATER DEPT.", M, M + 20, "700 46px 'JetBrains Mono'", PAPER, { spacing: 6 });
  text("Nº 01 — LOCATION WITHHELD", W - M, M + 20, m46, PAPER, { align: "right", spacing: 6 });
  regMark(W - M - 30, M + 130, 26, ORANGE);

  // Contact strip down the right side.
  contactStrip(stripPhotos.map((p, i) => ({ img: stripImgs[i], fx: p[2], fy: p[3] })), 2540, 520, 0.028);
  text("ROLL 07 · FR. 14–16 · PUSHED 2", 2560, 2370, m46, PAPER, { spacing: 4, rot: 0.028 });

  // The line — label-maker strip, nothing louder.
  const line = LINES[+$("slogan").value];
  ctx.font = "700 92px 'JetBrains Mono'"; ctx.letterSpacing = "10px";
  const lw = ctx.measureText(line).width;
  const ly = H - 1300;
  ctx.save(); ctx.translate(M - 10, ly); ctx.rotate(-0.012);
  ctx.fillStyle = INK; ctx.fillRect(0, -100, lw + 80, 140);
  ctx.restore();
  text(line, M + 30, ly, "700 92px 'JetBrains Mono'", PAPER, { spacing: 10, rot: -0.012 });

  // Wordmark — misregistered two-colour print, cut off by the bottom edge.
  ctx.font = "1000px 'Archivo Black'"; ctx.letterSpacing = "-10px";
  const sx = (W - 2 * 110) / ctx.measureText("SVRF").width;
  const mark = (dx, dy, color) => {
    ctx.save(); ctx.translate(W / 2 + dx, H + 150 + dy); ctx.scale(sx, sx * 0.94);
    ctx.font = "1000px 'Archivo Black'"; ctx.letterSpacing = "-10px"; ctx.textAlign = "center"; ctx.fillStyle = color;
    ctx.fillText("SVRF", 0, 0); ctx.restore();
  };
  mark(26, -18, ORANGE);
  mark(0, 0, PAPER);
  ctx.letterSpacing = "0px";

  grainAndDust();
  ctx.restore();

  $("status").textContent = missing.length
    ? `Rendered — couldn't load: ${missing.join(", ")} (shown as dark plates).`
    : "Rendered from Shopify media. Transparent outside the print.";
  $("dl").disabled = false;
}

$("dl").onclick = () => {
  try {
    cv.toBlob((b) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = "svrf-hoodie-back.png"; a.click();
    }, "image/png");
  } catch (e) {
    $("status").textContent = "Export blocked by the browser (image CORS). Serve this folder over http:// and retry.";
  }
};

PHOTOS.forEach((p, i) => $("hero").add(new Option(p[0], i)));
LINES.forEach((l, i) => $("slogan").add(new Option(l, i)));
["hero", "treat", "slogan"].forEach((id) => ($(id).onchange = render));
$("garment").onchange = () => $("g").style.setProperty("background", $("garment").value);
render();
</script>
</body>
</html>

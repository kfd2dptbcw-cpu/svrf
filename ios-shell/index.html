<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SVRF Forecast</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0B0D0E; color: #f2f4f5; font-family: -apple-system, system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; gap: 1rem; }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.04em; }
    p { margin: 0; opacity: 0.7; }
    button { margin-top: 0.5rem; padding: 0.75rem 1.5rem; border: 0; border-radius: 999px; background: #f2f4f5; color: #0B0D0E; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>SVRF</h1>
    <p>No connection. Check your signal and try again.</p>
    <button onclick="location.href='https://forecast.svrf.uk'">Retry</button>
  </main>
</body>
</html>

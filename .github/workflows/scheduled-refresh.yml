# Daily forecast refresh (06:05 UTC). This is the ONLY place the data providers are
# called: `npm run refresh` fetches every spot and writes the result to Upstash,
# which the site reads. GitHub Actions has no 10-second function limit, and the
# refresh refuses to start within 3 hours of the previous attempt (use the
# "force" input to override).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN   required — the site's shared cache
#   XWEATHER_CLIENT_ID, XWEATHER_CLIENT_SECRET         required for Xweather
#   FORECAST_DATA_SOURCE, FALLBACK_DATA_SOURCE, FORECAST_DAYS, XWEATHER_INTERVAL_HOURS,
#   TIDE_PROVIDER, ADMIRALTY_API_KEY, REFRESH_HOURS_UTC  optional — must match the site's values
#   FORECAST_SITE_URL, CRON_SECRET                     optional — ping the site afterwards so pages
#                                                      regenerate now rather than within the hour
name: Scheduled forecast refresh

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a refresh even if the last attempt was under 3 hours ago"
        type: boolean
        default: false

# Never run two refreshes at once.
concurrency:
  group: forecast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
      XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
      FORECAST_DATA_SOURCE: ${{ secrets.FORECAST_DATA_SOURCE }}
      FALLBACK_DATA_SOURCE: ${{ secrets.FALLBACK_DATA_SOURCE }}
      FORECAST_DAYS: ${{ secrets.FORECAST_DAYS }}
      XWEATHER_INTERVAL_HOURS: ${{ secrets.XWEATHER_INTERVAL_HOURS }}
      TIDE_PROVIDER: ${{ secrets.TIDE_PROVIDER }}
      ADMIRALTY_API_KEY: ${{ secrets.ADMIRALTY_API_KEY }}
      REFRESH_HOURS_UTC: ${{ secrets.REFRESH_HOURS_UTC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh forecasts
        run: npm ci && npm run refresh -- ${{ inputs.force && '--force' || '' }}
      - name: Regenerate site pages
        env:
          SITE_URL: ${{ secrets.FORECAST_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "FORECAST_SITE_URL secret is not set; pages will pick up the new forecast within the hour."
            exit 0
          fi
          # Read-only status endpoint: it never calls the data providers.
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/refresh"

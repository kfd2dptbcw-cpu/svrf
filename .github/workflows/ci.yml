name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run config:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Build with synthetic data so CI never depends on (or spends) live API quota.
      - run: npm run build
        env:
          FORECAST_DATA_SOURCE: sample
          NEXT_PUBLIC_SITE_URL: https://example.com
